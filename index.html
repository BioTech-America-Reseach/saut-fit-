<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AI Studio Pro · Fast Export</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070a10;font-family:'Segoe UI',system-ui,sans-serif;color:#eef2f6;padding:12px;min-height:100vh}
.container{max-width:1340px;margin:0 auto;background:#0d121b;border-radius:18px;padding:16px;border:1px solid #1c2536}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.header h1{font-size:1.25rem;font-weight:700;display:flex;align-items:center;gap:8px}
.header h1 i{color:#60a5fa}
.badge{background:linear-gradient(135deg,#3b82f6,#8b5cf6);padding:3px 10px;border-radius:14px;font-size:0.55rem;font-weight:700}
.badge-ai{background:linear-gradient(135deg,#f59e0b,#ef4444)}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#172033;padding:8px 12px;border-radius:28px;margin-bottom:12px;border:1px solid #2a364d}
.toolbar button{background:#2a364d;border:1px solid #3b4b66;color:#dbe4f3;padding:6px 12px;border-radius:16px;font-weight:600;font-size:0.73rem;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.toolbar button:hover{background:#3b4b66}
.toolbar button.primary{background:#3b82f6;border-color:#3b82f6;color:#fff}
.toolbar button.success{background:#10b981;border-color:#10b981;color:#fff}
.toolbar button.warning{background:#f59e0b;border-color:#f59e0b;color:#fff}
.toolbar button.danger{background:#ef4444;border-color:#ef4444;color:#fff}
.sep{width:1px;height:20px;background:#3b4b66}
.status-text{font-size:0.7rem;color:#94a3b8;margin-left:auto;padding:3px 10px;background:#0f172a;border-radius:12px}
.rec-timer{background:#ef4444;color:#fff;padding:3px 9px;border-radius:11px;font-size:0.72rem;font-weight:700;display:none}
.rec-timer.active{display:inline-block}
.main-grid{display:grid;grid-template-columns:1fr 290px;gap:12px}
@media(max-width:960px){.main-grid{grid-template-columns:1fr}}
.preview-panel{background:#0f172a;border-radius:14px;border:1px solid #1e293b;overflow:hidden}
.preview-header{padding:7px 12px;background:#1e293b;display:flex;justify-content:space-between;font-size:0.72rem;color:#94a3b8}
#previewCanvas{width:100%;background:#000;display:block;cursor:grab}
.preview-controls{padding:7px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#0f172a}
.preview-controls button,.preview-controls select{background:#2a364d;border:1px solid #3b4b66;color:#dbe4f3;padding:5px 9px;border-radius:11px;font-size:0.71rem;cursor:pointer}
.preview-controls button.primary{background:#3b82f6;border-color:#3b82f6;color:#fff}
.side-panel{display:flex;flex-direction:column;gap:9px}
.panel{background:#172033;border-radius:13px;border:1px solid #2a364d;padding:10px 12px}
.panel h3{font-size:0.78rem;color:#fbbf24;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.panel label{font-size:0.66rem;color:#94a3b8;display:block;margin-bottom:3px}
.panel input[type=text],.panel select,.panel textarea,.panel input[type=number]{width:100%;background:#0f172a;border:1px solid #2a364d;color:#e2e8f0;padding:6px 8px;border-radius:7px;font-size:0.74rem;margin-bottom:5px}
.panel textarea{min-height:44px;resize:vertical}
.btn-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.btn-row button{background:#2a364d;border:1px solid #3b4b66;color:#dbe4f3;padding:5px 9px;border-radius:7px;font-size:0.7rem;cursor:pointer}
.btn-row button.primary{background:#3b82f6;border-color:#3b82f6;color:#fff}
.btn-row button.success{background:#10b981;border-color:#10b981;color:#fff}
.btn-row button.danger{background:#ef4444;border-color:#ef4444;color:#fff}
.image-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;max-height:85px;overflow-y:auto}
.thumb-wrap{position:relative}
.image-thumb{width:44px;height:44px;border-radius:6px;object-fit:cover;border:2px solid #3b4b66}
.thumb-del{position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;width:15px;height:15px;border-radius:50%;font-size:9px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.wave-area{background:#0f172a;border-radius:13px;padding:9px;border:1px solid #1e293b;margin-top:9px}
#wave-container{width:100%;height:78px;background:#020617;border-radius:9px;position:relative;overflow:hidden;cursor:crosshair}
#waveCanvas{display:block;width:100%;height:100%}
.playhead{position:absolute;top:0;left:0;width:2px;height:100%;background:#fbbf24;box-shadow:0 0 7px #fbbf24aa;z-index:5;pointer-events:none}
.selection-region{position:absolute;top:0;height:100%;background:rgba(239,68,68,0.25);border:1px solid #ef4444;z-index:4;display:none;pointer-events:none}
.transport{display:flex;gap:7px;align-items:center;margin-top:5px;flex-wrap:wrap}
.transport button{background:transparent;border:none;color:#cbd5e1;font-size:0.95rem;padding:3px 6px;cursor:pointer}
.transport .play-btn{background:#3b82f6;color:#fff;padding:5px 13px;font-size:0.8rem;border-radius:20px;font-weight:700}
#timeDisplay{font-size:0.72rem;color:#94a3b8}
.controls{display:flex;flex-wrap:wrap;gap:7px 11px;background:#172033;padding:6px 11px;border-radius:20px;margin-top:5px;border:1px solid #2a364d;align-items:center}
.controls label{font-size:0.63rem;color:#94a3b8;display:flex;align-items:center;gap:4px}
.controls input[type=range]{width:50px;height:3px;background:#2a364d;border-radius:5px;-webkit-appearance:none}
.controls input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;background:#fbbf24;border-radius:50%;cursor:pointer}
.controls .val{min-width:15px;color:#fbbf24;font-weight:600;font-size:0.64rem}
.metrics-box{background:#172033;border-radius:9px;padding:7px 11px;margin-top:7px;border:1px solid #2a364d;display:none;grid-template-columns:repeat(4,1fr);gap:3px}
.metrics-box.active{display:grid}
.metrics-box .item{text-align:center}
.metrics-box .item .label{font-size:0.52rem;color:#64748b;text-transform:uppercase}
.metrics-box .item .value{font-size:0.85rem;font-weight:700;color:#fbbf24}
.metrics-box .item .value.green{color:#34d399}
.metrics-box .item .value.red{color:#f87171}
.info-bar{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px;color:#64748b;font-size:0.63rem}
.info-bar span{background:#0f172a;padding:2px 7px;border-radius:10px;border:1px solid #1e293b}
.countdown-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);display:none;justify-content:center;align-items:center;flex-direction:column;z-index:9999}
.countdown-overlay.active{display:flex}
.countdown-number{font-size:110px;font-weight:800;color:#fff}
.countdown-number.start{color:#34d399;font-size:52px}
.file-hidden{display:none}
</style>
</head>
<body>
<div class="countdown-overlay" id="countdownOverlay">
    <div class="countdown-number" id="countdownNumber">3</div>
</div>

<div class="container">
    <div class="header">
        <h1><i class="fas fa-microphone-lines"></i> AI Studio Pro <span class="badge">Fast</span> <span class="badge badge-ai">AI</span></h1>
    </div>

    <div class="toolbar">
        <button id="recordBtn" class="primary"><i class="fas fa-circle"></i> Rekodi</button>
        <button id="stopBtn" class="danger"><i class="fas fa-stop"></i></button>
        <span class="rec-timer" id="recTimer">00:00</span>
        <div class="sep"></div>
        <button id="uploadAudioBtn"><i class="fas fa-upload"></i> Audio</button>
        <input type="file" id="audioInput" class="file-hidden" accept="audio/*">
        <button id="uploadImageBtn"><i class="fas fa-images"></i> Picha</button>
        <input type="file" id="imageInput" class="file-hidden" accept="image/*" multiple>
        <button id="uploadOverlayBtn"><i class="fas fa-layer-group"></i> Overlay</button>
        <input type="file" id="overlayInput" class="file-hidden" accept="image/*">
        <div class="sep"></div>
        <button id="autoRemoveBtn" class="warning"><i class="fas fa-magic"></i> Ondoa Silence</button>
        <button id="enhanceBtn" class="success"><i class="fas fa-sliders"></i> Boost</button>
        <span class="status-text" id="statusDisplay">Tayari</span>
    </div>

    <div class="main-grid">
        <div>
            <div class="preview-panel">
                <div class="preview-header">
                    <span>Preview • Drag Overlay & Text</span>
                    <span id="previewRes">1280×720</span>
                </div>
                <canvas id="previewCanvas" width="1280" height="720"></canvas>
                <div class="preview-controls">
                    <button id="playPreviewBtn" class="primary"><i class="fas fa-play"></i> Cheza</button>
                    <button id="stopPreviewBtn"><i class="fas fa-stop"></i></button>
                    <select id="aspectSelect">
                        <option value="16:9">16:9</option>
                        <option value="9:16">9:16</option>
                        <option value="1:1">1:1</option>
                    </select>
                    <select id="resSelect">
                        <option value="1080">1080p</option>
                        <option value="720" selected>720p</option>
                        <option value="480">480p</option>
                    </select>
                </div>
            </div>

            <div class="wave-area">
                <div id="wave-container">
                    <canvas id="waveCanvas"></canvas>
                    <div id="playhead" class="playhead"></div>
                    <div id="selectionRegion" class="selection-region"></div>
                </div>
                <div class="transport">
                    <button id="playBtn" class="play-btn"><i class="fas fa-play"></i></button>
                    <button id="pauseBtn"><i class="fas fa-pause"></i></button>
                    <button id="deleteRegionBtn" style="background:#ef4444;color:#fff;border:none;padding:4px 11px;border-radius:13px;font-size:0.72rem;cursor:pointer">
                        <i class="fas fa-trash"></i> Futa
                    </button>
                    <span id="timeDisplay">00:00 / 00:00</span>
                </div>
                <div class="controls">
                    <label>Thresh <input type="range" id="thresholdSlider" min="30" max="55" value="45"><span class="val" id="thresholdVal">-45dB</span></label>
                    <label>MinSil <input type="range" id="minSilenceSlider" min="300" max="900" value="500"><span class="val" id="minSilenceVal">500ms</span></label>
                    <label>Pad <input type="range" id="paddingSlider" min="20" max="100" value="50"><span class="val" id="paddingVal">50ms</span></label>
                    <label>Fade <input type="range" id="fadeSlider" min="5" max="25" value="12"><span class="val" id="fadeVal">12ms</span></label>
                    <label>Boost <input type="range" id="boostSlider" min="120" max="230" value="165"><span class="val" id="boostVal">165%</span></label>
                </div>
            </div>

            <div class="metrics-box" id="metricsBox">
                <div class="item"><div class="label">Awali</div><div class="value" id="metricOriginal">0s</div></div>
                <div class="item"><div class="label">Baada</div><div class="value green" id="metricProcessed">0s</div></div>
                <div class="item"><div class="label">Kimya</div><div class="value red" id="metricRemoved">0s</div></div>
                <div class="item"><div class="label">%</div><div class="value" id="metricPercent">0%</div></div>
            </div>
        </div>

        <div class="side-panel">
            <div class="panel">
                <h3><i class="fas fa-images"></i> Picha + Overlay</h3>
                <div class="btn-row">
                    <button id="addImageBtn" class="primary"><i class="fas fa-plus"></i> Picha</button>
                    <button id="clearImagesBtn" class="danger">Futa</button>
                </div>
                <div class="image-list" id="imageList"></div>
                <label style="margin-top:6px">Effect</label>
                <select id="imageEffect">
                    <option value="fade">Fade</option>
                    <option value="zoom">Zoom In</option>
                    <option value="zoomout">Zoom Out</option>
                    <option value="kenburns">Ken Burns</option>
                    <option value="slide">Slide Left</option>
                    <option value="slideright">Slide Right</option>
                    <option value="rotate">Rotate</option>
                    <option value="pulse">Pulse</option>
                    <option value="vibrant">Vibrant</option>
                </select>
                <label style="margin-top:6px">Overlay Size</label>
                <input type="range" id="overlaySize" min="15" max="55" value="28" style="width:100%">
            </div>

            <div class="panel">
                <h3><i class="fas fa-font"></i> Text</h3>
                <textarea id="textInput" placeholder="Andika text..."></textarea>
                <div style="display:flex;gap:5px">
                    <select id="textFont" style="flex:1">
                        <option value="Arial Black">Arial Black</option>
                        <option value="Impact">Impact</option>
                        <option value="Georgia">Georgia</option>
                    </select>
                    <input type="number" id="textSize" value="54" min="18" max="160" style="width:55px">
                </div>
                <div style="display:flex;gap:5px">
                    <input type="color" id="textColor" value="#ffffff" style="flex:1;height:28px">
                    <input type="color" id="textBg" value="#000000" style="flex:1;height:28px">
                </div>
                <label><input type="checkbox" id="textBold" checked> Bold</label>
                <label><input type="checkbox" id="textBgEnable"> Background</label>
                <div class="btn-row">
                    <button id="addTextBtn" class="primary">Ongeza</button>
                    <button id="clearTextBtn" class="danger">Futa</button>
                </div>
            </div>

            <div class="panel">
                <h3><i class="fas fa-download"></i> Pakua (Haraka)</h3>
                <div class="btn-row">
                    <button id="exportVideoBtn" class="success"><i class="fas fa-video"></i> Video</button>
                    <button id="exportWavBtn"><i class="fas fa-file-audio"></i> WAV</button>
                </div>
            </div>
        </div>
    </div>

    <div class="info-bar">
        <span>Rekodi → Ondoa Silence → Boost → Ongeza Picha → Pakua</span>
        <span>Drag Overlay & Text free</span>
    </div>
</div>

<script>
(function(){
    const waveCanvas = document.getElementById('waveCanvas');
    const wctx = waveCanvas.getContext('2d');
    const previewCanvas = document.getElementById('previewCanvas');
    const pctx = previewCanvas.getContext('2d');
    const container = document.getElementById('wave-container');
    const playhead = document.getElementById('playhead');
    const selectionRegion = document.getElementById('selectionRegion');

    let audioCtx = null;
    let originalBuffer = null;
    let audioBuffer = null;
    let source = null;
    let isPlaying = false;
    let startTime = 0;
    let pauseOffset = 0;
    let currentTime = 0;
    let animId = null;

    let images = [];
    let overlay = {img: null, x: 0.78, y: 0.12};
    let textOverlays = [];
    let selectedTextIdx = -1;
    let isDraggingText = false;
    let isDraggingOverlay = false;
    let dragOffset = {x:0, y:0};

    let isSelecting = false;
    let selStartX = 0, selEndX = 0;
    let selectedStartSample = 0, selectedEndSample = 0;

    let isPreviewPlaying = false;
    let previewAnimId = null;
    let isRecording = false;
    let recStartTime = 0;
    let recTimerInterval = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let stream = null;

    function initAudio(){
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
    }

    // Silence Removal
    function aiRemoveSilence(buffer){
        if(!buffer) return buffer;
        const data = buffer.getChannelData(0);
        const rate = buffer.sampleRate;
        const dbVal = parseFloat(document.getElementById('thresholdSlider').value);
        const threshold = Math.pow(10, -dbVal / 20);
        const minSilenceMs = parseFloat(document.getElementById('minSilenceSlider').value);
        const paddingMs = parseFloat(document.getElementById('paddingSlider').value);
        const fadeMs = parseFloat(document.getElementById('fadeSlider').value);
        const minSilenceSamples = Math.floor(minSilenceMs/1000 * rate);
        const paddingSamples = Math.floor(paddingMs/1000 * rate);
        const fadeSamples = Math.floor(fadeMs/1000 * rate);
        const win = Math.floor(rate * 0.02);

        let found = [];
        let inSound = false, soundStart = 0, inSilence = false, silenceStart = 0;

        for(let i=0; i<data.length; i+=Math.floor(win/2)){
            const end = Math.min(i+win, data.length);
            let sum = 0;
            for(let j=i;j<end;j++) sum += data[j]*data[j];
            const energy = Math.sqrt(sum/(end-i));
            const isSpeech = energy > threshold;

            if(isSpeech && !inSound){
                inSound = true;
                soundStart = Math.max(0, i - paddingSamples);
                inSilence = false;
            } else if(!isSpeech && inSound && !inSilence){
                inSilence = true;
                silenceStart = i;
            } else if(isSpeech && inSound && inSilence){
                if(i - silenceStart >= minSilenceSamples){
                    if(silenceStart - soundStart > Math.floor(rate*0.015)){
                        found.push({start: soundStart, end: Math.min(data.length, silenceStart + paddingSamples)});
                    }
                    soundStart = Math.max(0, i - paddingSamples);
                }
                inSilence = false;
            }
        }
        if(inSound){
            const endPos = inSilence ? silenceStart : data.length;
            if(endPos - soundStart > Math.floor(rate*0.015)){
                found.push({start: soundStart, end: Math.min(data.length, endPos)});
            }
        }
        if(found.length === 0) found.push({start:0, end:data.length});

        found.sort((a,b)=>a.start-b.start);
        let merged = [found[0]];
        for(let i=1;i<found.length;i++){
            if(found[i].start <= merged[merged.length-1].end + Math.floor(rate*0.03)){
                merged[merged.length-1].end = Math.max(merged[merged.length-1].end, found[i].end);
            } else merged.push(found[i]);
        }

        let newData = [];
        merged.forEach((seg, idx)=>{
            let segData = Array.from(data.slice(seg.start, seg.end));
            const fi = Math.min(fadeSamples, segData.length);
            for(let i=0;i<fi;i++) segData[i] *= (i/fi);
            const fo = Math.min(fadeSamples, segData.length);
            for(let i=0;i<fo;i++) segData[segData.length-1-i] *= (i/fo);

            if(idx === 0){
                newData.push(...segData);
            } else {
                const cf = Math.min(fadeSamples, segData.length, newData.length);
                for(let i=0;i<cf;i++){
                    const t = i/cf;
                    newData[newData.length - cf + i] = newData[newData.length - cf + i]*(1-t) + segData[i]*t;
                }
                newData.push(...segData.slice(cf));
            }
        });

        if(newData.length < 100) return buffer;
        const nb = audioCtx.createBuffer(1, newData.length, rate);
        nb.copyToChannel(new Float32Array(newData), 0);

        const origDur = data.length/rate;
        const procDur = newData.length/rate;
        document.getElementById('metricOriginal').textContent = origDur.toFixed(2)+'s';
        document.getElementById('metricProcessed').textContent = procDur.toFixed(2)+'s';
        document.getElementById('metricRemoved').textContent = (origDur-procDur).toFixed(2)+'s';
        document.getElementById('metricPercent').textContent = ((origDur-procDur)/origDur*100).toFixed(1)+'%';
        document.getElementById('metricsBox').classList.add('active');
        return nb;
    }

    function applyStudioBoost(buffer){
        if(!buffer) return buffer;
        const data = buffer.getChannelData(0);
        const boost = parseFloat(document.getElementById('boostSlider').value)/100;
        const len = data.length;
        let out = new Float32Array(len);
        let prev=0, peak=0;
        const hp=0.975;
        for(let i=0;i<len;i++){
            const filtered = hp*(prev + data[i] - (i>0?data[i-1]:0));
            prev = filtered;
            let s = filtered * boost;
            if(Math.abs(s)>0.48) s = Math.sign(s)*(0.48+(Math.abs(s)-0.48)*0.28);
            out[i]=s;
            if(Math.abs(s)>peak) peak=Math.abs(s);
        }
        if(peak>0.01){
            const norm=0.87/peak;
            for(let i=0;i<len;i++) out[i]=Math.max(-0.95,Math.min(0.95,out[i]*norm));
        }
        const nb=audioCtx.createBuffer(1,len,buffer.sampleRate);
        nb.copyToChannel(out,0);
        return nb;
    }

    function deleteSelectedRegion(){
        if(!audioBuffer || selectedEndSample<=selectedStartSample) return alert('Chagua sehemu kwanza');
        const data=audioBuffer.getChannelData(0);
        const rate=audioBuffer.sampleRate;
        const fade=Math.floor(0.012*rate);
        let newData=[];
        for(let i=0;i<selectedStartSample;i++) newData.push(data[i]);
        const afterStart=selectedEndSample;
        const cf=Math.min(fade,newData.length,data.length-afterStart);
        for(let i=0;i<cf;i++){
            const t=i/cf;
            newData[newData.length-cf+i] = (newData[newData.length-cf+i]||0)*(1-t) + (data[afterStart+i]||0)*t;
        }
        for(let i=cf;i<data.length-afterStart;i++) newData.push(data[afterStart+i]);
        if(newData.length<100) return;
        const nb=audioCtx.createBuffer(1,newData.length,rate);
        nb.copyToChannel(new Float32Array(newData),0);
        loadAudio(nb,false);
        clearSelection();
        document.getElementById('statusDisplay').textContent='Sehemu imefutwa';
    }

    function clearSelection(){
        selectionRegion.style.display='none';
        selectedStartSample=0;
        selectedEndSample=0;
    }

    function loadAudio(buffer, storeOriginal=true){
        if(storeOriginal) originalBuffer=buffer;
        audioBuffer=buffer;
        renderWaveform(buffer);
        updateTimeDisplay();
        document.getElementById('statusDisplay').textContent='Imepakiwa';
        pauseOffset=0; currentTime=0;
        if(isPlaying) stopPlayback();
        clearSelection();
    }

    function renderWaveform(buffer){
        if(!buffer) return;
        const data=buffer.getChannelData(0);
        const step=Math.max(1,Math.floor(data.length/waveCanvas.width));
        wctx.clearRect(0,0,waveCanvas.width,waveCanvas.height);
        wctx.fillStyle='#020617';
        wctx.fillRect(0,0,waveCanvas.width,waveCanvas.height);
        wctx.beginPath();
        wctx.strokeStyle='#60a5fa';
        wctx.lineWidth=1.4;
        for(let i=0;i<waveCanvas.width;i++){
            let min=1,max=-1;
            for(let j=0;j<step;j++){
                const idx=i*step+j;
                if(idx<data.length){
                    const v=data[idx];
                    if(v<min)min=v; if(v>max)max=v;
                }
            }
            wctx.moveTo(i,waveCanvas.height/2-max*0.8*waveCanvas.height/2);
            wctx.lineTo(i,waveCanvas.height/2-min*0.8*waveCanvas.height/2);
        }
        wctx.stroke();
    }

    function playAudio(){
        if(!audioBuffer) return;
        initAudio();
        if(isPlaying) return;
        if(audioCtx.state==='suspended') audioCtx.resume();
        source=audioCtx.createBufferSource();
        source.buffer=audioBuffer;
        source.connect(audioCtx.destination);
        source.start(0,pauseOffset);
        startTime=audioCtx.currentTime-pauseOffset;
        isPlaying=true;
        document.getElementById('playBtn').innerHTML='<i class="fas fa-pause"></i>';
        updatePlayhead();
    }
    function pausePlayback(){
        if(!isPlaying) return;
        source.stop();
        isPlaying=false;
        pauseOffset=audioCtx.currentTime-startTime;
        cancelAnimationFrame(animId);
        document.getElementById('playBtn').innerHTML='<i class="fas fa-play"></i>';
    }
    function stopPlayback(){
        if(source) try{source.stop()}catch(e){}
        isPlaying=false; pauseOffset=0; currentTime=0;
        cancelAnimationFrame(animId);
        playhead.style.left='0%';
        updateTimeDisplay();
        document.getElementById('playBtn').innerHTML='<i class="fas fa-play"></i>';
    }
    function updatePlayhead(){
        if(!isPlaying) return;
        currentTime=Math.min(audioCtx.currentTime-startTime,audioBuffer.duration);
        playhead.style.left=(currentTime/audioBuffer.duration*100)+'%';
        updateTimeDisplay();
        if(currentTime>=audioBuffer.duration){stopPlayback();return}
        animId=requestAnimationFrame(updatePlayhead);
    }
    function updateTimeDisplay(){
        const dur=audioBuffer?audioBuffer.duration:0;
        document.getElementById('timeDisplay').textContent=`${formatTime(Math.min(currentTime,dur))} / ${formatTime(dur)}`;
    }
    function formatTime(t){
        const m=Math.floor(t/60),s=Math.floor(t%60);
        return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    // Recording
    async function startRecording(){
        if(isRecording) return;
        let count=3;
        const overlayEl=document.getElementById('countdownOverlay');
        const num=document.getElementById('countdownNumber');
        overlayEl.classList.add('active');
        function tick(){
            if(count>0){num.textContent=count;num.className='countdown-number';count--;setTimeout(tick,650)}
            else{
                num.textContent='START';num.className='countdown-number start';
                setTimeout(async()=>{
                    overlayEl.classList.remove('active');
                    try{
                        stream=await navigator.mediaDevices.getUserMedia({audio:true});
                        mediaRecorder=new MediaRecorder(stream);
                        recordedChunks=[];
                        mediaRecorder.ondataavailable=e=>recordedChunks.push(e.data);
                        mediaRecorder.onstop=()=>{
                            const blob=new Blob(recordedChunks,{type:'audio/webm'});
                            const reader=new FileReader();
                            reader.onload=async ev=>{
                                initAudio();
                                loadAudio(await audioCtx.decodeAudioData(ev.target.result));
                                document.getElementById('statusDisplay').textContent='Imerekodiwa';
                            };
                            reader.readAsArrayBuffer(blob);
                            clearInterval(recTimerInterval);
                            document.getElementById('recTimer').classList.remove('active');
                        };
                        mediaRecorder.start();
                        isRecording=true;
                        recStartTime=Date.now();
                        document.getElementById('recTimer').classList.add('active');
                        recTimerInterval=setInterval(()=>{
                            const e=(Date.now()-recStartTime)/1000;
                            document.getElementById('recTimer').textContent=`${String(Math.floor(e/60)).padStart(2,'0')}:${String(Math.floor(e%60)).padStart(2,'0')}`;
                        },200);
                        document.getElementById('statusDisplay').textContent='Inarekodi...';
                        document.getElementById('recordBtn').style.background='#dc2626';
                    }catch(e){alert('Ruhusu microphone')}
                },350);
            }
        }
        tick();
    }
    function stopRecording(){
        if(mediaRecorder&&mediaRecorder.state==='recording'){
            mediaRecorder.stop();
            stream.getTracks().forEach(t=>t.stop());
            isRecording=false;
            document.getElementById('recordBtn').style.background='#3b82f6';
        }
    }

    // Images
    function addImages(files){
        Array.from(files).forEach(file=>{
            const img=new Image();
            img.onload=()=>{
                images.push({img, name:file.name});
                renderImageList();
                drawPreviewFrame(0);
            };
            img.src=URL.createObjectURL(file);
        });
    }
    function renderImageList(){
        const list=document.getElementById('imageList');
        list.innerHTML='';
        images.forEach((item,i)=>{
            const wrap=document.createElement('div');
            wrap.className='thumb-wrap';
            const thumb=document.createElement('img');
            thumb.src=item.img.src;
            thumb.className='image-thumb';
            const del=document.createElement('div');
            del.className='thumb-del';
            del.innerHTML='×';
            del.onclick=e=>{e.stopPropagation();images.splice(i,1);renderImageList();drawPreviewFrame(0)};
            wrap.appendChild(thumb);wrap.appendChild(del);
            list.appendChild(wrap);
        });
    }

    function addText(){
        const text=document.getElementById('textInput').value.trim();
        if(!text) return;
        textOverlays.push({
            text,
            font:document.getElementById('textFont').value,
            size:parseInt(document.getElementById('textSize').value)||54,
            color:document.getElementById('textColor').value,
            bg:document.getElementById('textBg').value,
            bgEnable:document.getElementById('textBgEnable').checked,
            bold:document.getElementById('textBold').checked,
            x:previewCanvas.width/2,
            y:previewCanvas.height*0.78,
            scale:1,
            rotation:0
        });
        selectedTextIdx=textOverlays.length-1;
        drawPreviewFrame(0);
    }

    function updateCanvasSize(){
        const res=parseInt(document.getElementById('resSelect').value);
        const aspect=document.getElementById('aspectSelect').value;
        let w,h;
        if(aspect==='16:9'){w=res===1080?1920:res===720?1280:854;h=res}
        else if(aspect==='9:16'){h=res===1080?1920:res===720?1280:854;w=res}
        else{w=h=res}
        previewCanvas.width=w;
        previewCanvas.height=h;
        document.getElementById('previewRes').textContent=`${w}×${h}`;
        drawPreviewFrame(currentTime||0);
    }

    function drawPreviewFrame(time){
        const w = previewCanvas.width;
        const h = previewCanvas.height;
        pctx.fillStyle = '#000';
        pctx.fillRect(0, 0, w, h);

        if(images.length > 0){
            const duration = audioBuffer ? audioBuffer.duration : 8;
            const idx = Math.min(images.length-1, Math.floor((time / duration) * images.length));
            const imgObj = images[idx].img;
            if(imgObj && imgObj.complete){
                const effect = document.getElementById('imageEffect').value;
                const scale = Math.max(w/imgObj.width, h/imgObj.height);
                let iw = imgObj.width * scale;
                let ih = imgObj.height * scale;
                let ix = (w - iw)/2;
                let iy = (h - ih)/2;
                const localTime = (time % 3.5) / 3.5;

                pctx.save();
                if(effect === 'zoom'){
                    const z = 1 + localTime * 0.14;
                    pctx.translate(w/2, h/2); pctx.scale(z,z); pctx.translate(-w/2,-h/2);
                } else if(effect === 'zoomout'){
                    const z = 1.14 - localTime * 0.14;
                    pctx.translate(w/2, h/2); pctx.scale(z,z); pctx.translate(-w/2,-h/2);
                } else if(effect === 'kenburns'){
                    const z = 1 + localTime * 0.11;
                    pctx.translate(w/2 + (localTime-0.5)*40, h/2);
                    pctx.scale(z,z); pctx.translate(-w/2,-h/2);
                } else if(effect === 'slide'){
                    ix -= localTime * 80;
                } else if(effect === 'slideright'){
                    ix += localTime * 80;
                } else if(effect === 'rotate'){
                    pctx.translate(w/2,h/2);
                    pctx.rotate(localTime * 0.12);
                    pctx.translate(-w/2,-h/2);
                } else if(effect === 'pulse'){
                    const z = 1 + Math.sin(localTime * Math.PI * 2) * 0.04;
                    pctx.translate(w/2,h/2); pctx.scale(z,z); pctx.translate(-w/2,-h/2);
                } else if(effect === 'vibrant'){
                    pctx.filter = 'contrast(1.13) saturate(1.3) brightness(1.05)';
                }
                if(effect === 'fade') pctx.globalAlpha = 0.3 + localTime * 0.7;

                pctx.drawImage(imgObj, ix, iy, iw, ih);
                pctx.restore();
                pctx.filter = 'none';
                pctx.globalAlpha = 1;
            }
        }

        if(overlay.img && overlay.img.complete){
            const sizePct = parseFloat(document.getElementById('overlaySize').value)/100;
            const ow = w * sizePct;
            const oh = overlay.img.height * (ow / overlay.img.width);
            const ox = overlay.x * w - ow/2;
            const oy = overlay.y * h - oh/2;
            pctx.drawImage(overlay.img, ox, oy, ow, oh);
        }

        textOverlays.forEach(t=>{
            pctx.save();
            pctx.translate(t.x, t.y);
            pctx.rotate(t.rotation || 0);
            pctx.scale(t.scale, t.scale);
            const weight = t.bold ? 'bold' : 'normal';
            pctx.font = `${weight} ${t.size}px ${t.font}`;
            pctx.textAlign = 'center';
            pctx.textBaseline = 'middle';
            if(t.bgEnable){
                const m = pctx.measureText(t.text);
                pctx.fillStyle = t.bg;
                pctx.globalAlpha = 0.72;
                pctx.fillRect(-m.width/2-12, -t.size/2-8, m.width+24, t.size+16);
                pctx.globalAlpha = 1;
            }
            pctx.shadowColor = 'rgba(0,0,0,0.65)';
            pctx.shadowBlur = 6;
            pctx.shadowOffsetX = 1;
            pctx.shadowOffsetY = 2;
            pctx.fillStyle = t.color;
            pctx.fillText(t.text, 0, 0);
            pctx.restore();
        });
    }

    function startPreview(){
        if(!audioBuffer && !images.length) return alert('Ongeza content');
        isPreviewPlaying = true;
        const start = performance.now();
        const duration = audioBuffer ? audioBuffer.duration : 8;
        if(audioBuffer){ stopPlayback(); pauseOffset=0; playAudio(); }
        function loop(now){
            if(!isPreviewPlaying) return;
            const t = (now - start)/1000;
            if(t > duration){ isPreviewPlaying=false; stopPlayback(); return; }
            drawPreviewFrame(t);
            previewAnimId = requestAnimationFrame(loop);
        }
        previewAnimId = requestAnimationFrame(loop);
    }
    function stopPreview(){
        isPreviewPlaying = false;
        cancelAnimationFrame(previewAnimId);
        stopPlayback();
    }

    // ================== FAST VIDEO EXPORT ==================
    async function exportVideo(){
        if(!audioBuffer && !images.length) return alert('Hakuna content');
        updateCanvasSize();
        const duration = audioBuffer ? audioBuffer.duration : 6;
        const fps = 24;
        const totalFrames = Math.ceil(duration * fps);

        document.getElementById('statusDisplay').textContent = 'Inaandaa video... 0%';
        document.getElementById('exportVideoBtn').disabled = true;
        document.getElementById('exportVideoBtn').innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

        drawPreviewFrame(0);

        const canvasStream = previewCanvas.captureStream(fps);
        let combined = canvasStream;
        let audioSource = null;

        if(audioBuffer){
            const dest = audioCtx.createMediaStreamDestination();
            audioSource = audioCtx.createBufferSource();
            audioSource.buffer = audioBuffer;
            audioSource.connect(dest);
            combined = new MediaStream([
                ...canvasStream.getVideoTracks(),
                ...dest.stream.getAudioTracks()
            ]);
        }

        const recorder = new MediaRecorder(combined, {
            mimeType: 'video/webm;codecs=vp9',
            videoBitsPerSecond: 3500000
        });

        const chunks = [];
        recorder.ondataavailable = e => { if(e.data && e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `ai_studio_${Date.now()}.webm`;
            a.click();
            document.getElementById('statusDisplay').textContent = 'Video imepakuliwa!';
            document.getElementById('exportVideoBtn').disabled = false;
            document.getElementById('exportVideoBtn').innerHTML = '<i class="fas fa-video"></i> Video';
            stopPreview();
            if(audioSource) try{audioSource.stop()}catch(e){}
        };

        recorder.start(40);

        let frame = 0;
        function renderNextFrame(){
            if(frame > totalFrames){
                setTimeout(()=>{
                    recorder.stop();
                    combined.getTracks().forEach(t=>t.stop());
                },120);
                return;
            }
            const t = frame / fps;
            drawPreviewFrame(t);
            const percent = Math.min(100, Math.round((frame / totalFrames)*100));
            document.getElementById('statusDisplay').textContent = `Inapakua... ${percent}%`;
            frame++;
            if(frame % 4 === 0) setTimeout(renderNextFrame, 0);
            else requestAnimationFrame(renderNextFrame);
        }

        if(audioBuffer && audioSource) audioSource.start(0);
        renderNextFrame();
    }

    function exportWav(){
        if(!audioBuffer) return alert('Hakuna audio');
        document.getElementById('statusDisplay').textContent = 'Inaandaa WAV...';
        setTimeout(()=>{
            const data = audioBuffer.getChannelData(0);
            const buf = new ArrayBuffer(44 + data.length*2);
            const v = new DataView(buf);
            const ws = (o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
            ws(0,'RIFF');v.setUint32(4,36+data.length*2,true);ws(8,'WAVE');
            ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
            v.setUint32(24,audioBuffer.sampleRate,true);v.setUint32(28,audioBuffer.sampleRate*2,true);
            v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,data.length*2,true);
            for(let i=0;i<data.length;i++)v.setInt16(44+i*2,Math.max(-1,Math.min(1,data[i]))*0x7FFF,true);
            const a=document.createElement('a');
            a.href=URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
            a.download=`voice_${Date.now()}.wav`;
            a.click();
            document.getElementById('statusDisplay').textContent = 'WAV imepakuliwa!';
        },10);
    }

    // Events
    document.getElementById('thresholdSlider').oninput=function(){document.getElementById('thresholdVal').textContent='-'+this.value+'dB'};
    document.getElementById('minSilenceSlider').oninput=function(){document.getElementById('minSilenceVal').textContent=this.value+'ms'};
    document.getElementById('paddingSlider').oninput=function(){document.getElementById('paddingVal').textContent=this.value+'ms'};
    document.getElementById('fadeSlider').oninput=function(){document.getElementById('fadeVal').textContent=this.value+'ms'};
    document.getElementById('boostSlider').oninput=function(){document.getElementById('boostVal').textContent=this.value+'%'};

    document.getElementById('recordBtn').onclick=()=>isRecording?stopRecording():startRecording();
    document.getElementById('stopBtn').onclick=stopRecording;
    document.getElementById('playBtn').onclick=()=>isPlaying?pausePlayback():playAudio();
    document.getElementById('pauseBtn').onclick=pausePlayback;
    document.getElementById('deleteRegionBtn').onclick=deleteSelectedRegion;

    document.getElementById('uploadAudioBtn').onclick=()=>document.getElementById('audioInput').click();
    document.getElementById('audioInput').onchange=async e=>{
        const f=e.target.files[0];if(!f)return;
        initAudio();
        loadAudio(await audioCtx.decodeAudioData(await f.arrayBuffer()));
    };

    document.getElementById('uploadImageBtn').onclick=()=>document.getElementById('imageInput').click();
    document.getElementById('addImageBtn').onclick=()=>document.getElementById('imageInput').click();
    document.getElementById('imageInput').onchange=e=>addImages(e.target.files);
    document.getElementById('clearImagesBtn').onclick=()=>{images=[];renderImageList();drawPreviewFrame(0)};

    document.getElementById('uploadOverlayBtn').onclick=()=>document.getElementById('overlayInput').click();
    document.getElementById('overlayInput').onchange=e=>{
        const f=e.target.files[0];if(!f)return;
        const img=new Image();
        img.onload=()=>{overlay.img=img;overlay.x=0.78;overlay.y=0.12;drawPreviewFrame(0)};
        img.src=URL.createObjectURL(f);
    };

    document.getElementById('autoRemoveBtn').onclick=()=>{
        if(!originalBuffer) return alert('Rekodi au weka audio kwanza');
        document.getElementById('autoRemoveBtn').innerHTML='<i class="fas fa-spinner fa-spin"></i>';
        setTimeout(()=>{
            const result = aiRemoveSilence(originalBuffer);
            loadAudio(result, false);
            document.getElementById('autoRemoveBtn').innerHTML='<i class="fas fa-magic"></i> Ondoa Silence';
            document.getElementById('statusDisplay').textContent='Silence imeondolewa';
        },30);
    };

    document.getElementById('enhanceBtn').onclick=()=>{
        if(!audioBuffer) return alert('Hakuna audio');
        loadAudio(applyStudioBoost(audioBuffer),false);
        document.getElementById('statusDisplay').textContent='Boost imetumika';
    };

    document.getElementById('addTextBtn').onclick=addText;
    document.getElementById('clearTextBtn').onclick=()=>{textOverlays=[];selectedTextIdx=-1;drawPreviewFrame(0)};

    document.getElementById('playPreviewBtn').onclick=startPreview;
    document.getElementById('stopPreviewBtn').onclick=stopPreview;
    document.getElementById('exportVideoBtn').onclick=exportVideo;
    document.getElementById('exportWavBtn').onclick=exportWav;
    document.getElementById('aspectSelect').onchange=updateCanvasSize;
    document.getElementById('resSelect').onchange=updateCanvasSize;

    // Waveform selection
    container.addEventListener('mousedown',e=>{
        if(!audioBuffer) return;
        const rect=container.getBoundingClientRect();
        selStartX=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
        selEndX=selStartX;
        isSelecting=true;
        selectionRegion.style.display='block';
        selectionRegion.style.left=(selStartX*100)+'%';
        selectionRegion.style.width='0%';
    });
    container.addEventListener('mousemove',e=>{
        if(!isSelecting||!audioBuffer) return;
        const rect=container.getBoundingClientRect();
        selEndX=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
        const left=Math.min(selStartX,selEndX);
        const width=Math.abs(selEndX-selStartX);
        selectionRegion.style.left=(left*100)+'%';
        selectionRegion.style.width=(width*100)+'%';
    });
    window.addEventListener('mouseup',()=>{
        if(!isSelecting||!audioBuffer) return;
        isSelecting=false;
        const startPct=Math.min(selStartX,selEndX);
        const endPct=Math.max(selStartX,selEndX);
        if(endPct-startPct<0.004){clearSelection();return}
        selectedStartSample=Math.floor(startPct*audioBuffer.length);
        selectedEndSample=Math.floor(endPct*audioBuffer.length);
    });

    // Free drag
    previewCanvas.addEventListener('mousedown',e=>{
        const rect=previewCanvas.getBoundingClientRect();
        const x=(e.clientX-rect.left)*(previewCanvas.width/rect.width);
        const y=(e.clientY-rect.top)*(previewCanvas.height/rect.height);
        if(overlay.img){
            const sizePct=parseFloat(document.getElementById('overlaySize').value)/100;
            const ow=previewCanvas.width*sizePct;
            const oh=overlay.img.height*(ow/overlay.img.width);
            const ox=overlay.x*previewCanvas.width-ow/2;
            const oy=overlay.y*previewCanvas.height-oh/2;
            if(x>=ox&&x<=ox+ow&&y>=oy&&y<=oy+oh){
                isDraggingOverlay=true;
                dragOffset.x=x-(overlay.x*previewCanvas.width);
                dragOffset.y=y-(overlay.y*previewCanvas.height);
                return;
            }
        }
        if(textOverlays.length){
            selectedTextIdx=textOverlays.length-1;
            const t=textOverlays[selectedTextIdx];
            dragOffset.x=x-t.x;
            dragOffset.y=y-t.y;
            isDraggingText=true;
        }
    });
    window.addEventListener('mousemove',e=>{
        const rect=previewCanvas.getBoundingClientRect();
        const x=(e.clientX-rect.left)*(previewCanvas.width/rect.width);
        const y=(e.clientY-rect.top)*(previewCanvas.height/rect.height);
        if(isDraggingOverlay){
            overlay.x=Math.max(0.05,Math.min(0.95,(x-dragOffset.x)/previewCanvas.width));
            overlay.y=Math.max(0.05,Math.min(0.95,(y-dragOffset.y)/previewCanvas.height));
            drawPreviewFrame(currentTime||0);
        }
        if(isDraggingText&&selectedTextIdx>=0){
            const t=textOverlays[selectedTextIdx];
            t.x=x-dragOffset.x;
            t.y=y-dragOffset.y;
            drawPreviewFrame(currentTime||0);
        }
    });
    window.addEventListener('mouseup',()=>{isDraggingText=false;isDraggingOverlay=false});

    previewCanvas.addEventListener('wheel',e=>{
        if(selectedTextIdx<0) return;
        e.preventDefault();
        const t=textOverlays[selectedTextIdx];
        if(e.shiftKey) t.rotation=(t.rotation||0)+(e.deltaY>0?0.06:-0.06);
        else t.scale=Math.max(0.25,Math.min(4.5,t.scale+(e.deltaY>0?-0.07:0.07)));
        drawPreviewFrame(currentTime||0);
    },{passive:false});

    function resizeWave(){
        const rect=container.getBoundingClientRect();
        waveCanvas.width=rect.width;
        waveCanvas.height=rect.height;
        if(audioBuffer) renderWaveform(audioBuffer);
    }
    window.addEventListener('resize',resizeWave);
    setTimeout(resizeWave,50);
    updateCanvasSize();
})();
</script>
