<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AI Studio Pro · Reliable</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070a10;font-family:'Segoe UI',system-ui,sans-serif;color:#eef2f6;padding:12px;min-height:100vh}
.container{max-width:1360px;margin:0 auto;background:#0d121b;border-radius:18px;padding:16px;border:1px solid #1c2536}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.header h1{font-size:1.25rem;font-weight:700;display:flex;align-items:center;gap:8px}
.header h1 i{color:#60a5fa}
.badge{background:linear-gradient(135deg,#3b82f6,#8b5cf6);padding:3px 10px;border-radius:14px;font-size:0.55rem;font-weight:700}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#172033;padding:8px 12px;border-radius:28px;margin-bottom:12px;border:1px solid #2a364d}
.toolbar button{background:#2a364d;border:1px solid #3b4b66;color:#dbe4f3;padding:6px 12px;border-radius:16px;font-weight:600;font-size:0.73rem;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.toolbar button:hover{background:#3b4b66}
.toolbar button.primary{background:#3b82f6;border-color:#3b82f6;color:#fff}
.toolbar button.success{background:#10b981;border-color:#10b981;color:#fff}
.toolbar button.warning{background:#f59e0b;border-color:#f59e0b;color:#fff}
.toolbar button.danger{background:#ef4444;border-color:#ef4444;color:#fff}
.toolbar button:disabled{opacity:0.45;cursor:not-allowed}
.sep{width:1px;height:20px;background:#3b4b66}
.status-text{font-size:0.7rem;color:#94a3b8;margin-left:auto;padding:3px 10px;background:#0f172a;border-radius:12px}
.main-grid{display:grid;grid-template-columns:1fr 300px;gap:12px}
@media(max-width:980px){.main-grid{grid-template-columns:1fr}}
.preview-panel{background:#0f172a;border-radius:14px;border:1px solid #1e293b;overflow:hidden}
.preview-header{padding:7px 12px;background:#1e293b;display:flex;justify-content:space-between;font-size:0.72rem;color:#94a3b8}
#previewCanvas{width:100%;background:#000;display:block;cursor:grab}
.preview-controls{padding:7px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#0f172a}
.preview-controls button,.preview-controls select{background:#2a364d;border:1px solid #3b4b66;color:#dbe4f3;padding:5px 9px;border-radius:11px;font-size:0.71rem;cursor:pointer}
.preview-controls button.primary{background:#3b82f6;border-color:#3b82f6;color:#fff}
.side-panel{display:flex;flex-direction:column;gap:9px}
.panel{background:#172033;border-radius:13px;border:1px solid #2a364d;padding:10px 12px}
.panel h3{font-size:0.78rem;color:#fbbf24;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.panel label{font-size:0.66rem;color:#94a3b8;display:block;margin-bottom:3px}
.panel select,.panel input[type=number],.panel textarea{width:100%;background:#0f172a;border:1px solid #2a364d;color:#e2e8f0;padding:6px 8px;border-radius:7px;font-size:0.74rem;margin-bottom:5px}
.panel textarea{min-height:42px;resize:vertical}
.btn-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.btn-row button{background:#2a364d;border:1px solid #3b4b66;color:#dbe4f3;padding:5px 9px;border-radius:7px;font-size:0.7rem;cursor:pointer}
.btn-row button.primary{background:#3b82f6;border-color:#3b82f6;color:#fff}
.btn-row button.danger{background:#ef4444;border-color:#ef4444;color:#fff}
.image-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;max-height:80px;overflow-y:auto}
.thumb-wrap{position:relative}
.image-thumb{width:42px;height:42px;border-radius:6px;object-fit:cover;border:2px solid #3b4b66;cursor:pointer}
.image-thumb.selected{border-color:#fbbf24}
.thumb-del{position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;width:15px;height:15px;border-radius:50%;font-size:9px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.wave-area{background:#0f172a;border-radius:13px;padding:9px;border:1px solid #1e293b;margin-top:9px}
#wave-container{width:100%;height:90px;background:#020617;border-radius:9px;position:relative;overflow:hidden;cursor:pointer}
#waveCanvas{display:block;width:100%;height:100%}
.playhead{position:absolute;top:0;width:3px;height:100%;background:#fbbf24;box-shadow:0 0 8px #fbbf24cc;z-index:10;cursor:ew-resize}
.playhead::before{content:'';position:absolute;top:-2px;left:-5px;width:13px;height:13px;background:#fbbf24;border-radius:50%}
.selection-region{position:absolute;top:0;height:100%;background:rgba(239,68,68,0.25);border:1px solid #ef4444;z-index:4;display:none;pointer-events:none}
.transport{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.transport button{background:transparent;border:none;color:#cbd5e1;font-size:1rem;padding:4px 7px;cursor:pointer}
.transport .play-btn{background:#3b82f6;color:#fff;padding:6px 16px;font-size:0.85rem;border-radius:20px;font-weight:700}
#timeDisplay{font-size:0.8rem;color:#fbbf24;font-weight:600;min-width:110px}
.controls{display:flex;flex-wrap:wrap;gap:8px 12px;background:#172033;padding:7px 12px;border-radius:20px;margin-top:6px;border:1px solid #2a364d;align-items:center}
.controls label{font-size:0.63rem;color:#94a3b8;display:flex;align-items:center;gap:4px}
.controls input[type=range]{width:50px;height:3px;background:#2a364d;border-radius:5px;-webkit-appearance:none}
.controls input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;background:#fbbf24;border-radius:50%;cursor:pointer}
.file-hidden{display:none}
.info-bar{margin-top:8px;font-size:0.65rem;color:#64748b}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-microphone-lines"></i> AI Studio Pro <span class="badge">Reliable</span></h1>
    </div>

    <div class="toolbar">
        <button id="recordBtn" class="primary"><i class="fas fa-circle"></i> Rekodi</button>
        <button id="stopBtn" class="danger"><i class="fas fa-stop"></i></button>
        <div class="sep"></div>
        <button id="uploadAudioBtn"><i class="fas fa-upload"></i> Audio</button>
        <input type="file" id="audioInput" class="file-hidden" accept="audio/*">
        <button id="uploadImageBtn"><i class="fas fa-images"></i> Picha</button>
        <input type="file" id="imageInput" class="file-hidden" accept="image/*" multiple>
        <div class="sep"></div>
        <button id="undoBtn" title="Undo"><i class="fas fa-undo"></i></button>
        <button id="redoBtn" title="Redo"><i class="fas fa-redo"></i></button>
        <div class="sep"></div>
        <button id="autoRemoveBtn" class="warning"><i class="fas fa-magic"></i> Ondoa Silence</button>
        <button id="enhanceBtn" class="success"><i class="fas fa-sliders"></i> Boost</button>
        <span class="status-text" id="statusDisplay">Tayari</span>
    </div>

    <div class="main-grid">
        <div>
            <div class="preview-panel">
                <div class="preview-header">
                    <span>Preview</span>
                    <span id="previewRes">1280×720</span>
                </div>
                <canvas id="previewCanvas" width="1280" height="720"></canvas>
                <div class="preview-controls">
                    <button id="playPreviewBtn" class="primary"><i class="fas fa-play"></i> Cheza</button>
                    <button id="stopPreviewBtn"><i class="fas fa-stop"></i></button>
                    <select id="aspectSelect">
                        <option value="16:9">16:9</option>
                        <option value="9:16">9:16 TikTok</option>
                        <option value="1:1">1:1</option>
                    </select>
                    <select id="resSelect">
                        <option value="720" selected>720p</option>
                        <option value="1080">1080p</option>
                        <option value="480">480p</option>
                    </select>
                </div>
            </div>

            <div class="wave-area">
                <div id="wave-container">
                    <canvas id="waveCanvas"></canvas>
                    <div id="playhead" class="playhead" style="left:0%"></div>
                    <div id="selectionRegion" class="selection-region"></div>
                </div>
                <div class="transport">
                    <button id="playBtn" class="play-btn"><i class="fas fa-play"></i></button>
                    <button id="pauseBtn"><i class="fas fa-pause"></i></button>
                    <button id="stopPlayBtn"><i class="fas fa-stop"></i></button>
                    <span id="timeDisplay">00:00.0 / 00:00.0</span>
                    <button id="deleteRegionBtn" style="background:#ef4444;color:#fff;border:none;padding:5px 12px;border-radius:12px;font-size:0.72rem;cursor:pointer;margin-left:8px">
                        <i class="fas fa-trash"></i> Futa Sehemu
                    </button>
                </div>
                <div class="controls">
                    <label>Thresh <input type="range" id="thresholdSlider" min="30" max="55" value="45"></label>
                    <label>MinSil <input type="range" id="minSilenceSlider" min="300" max="900" value="500"></label>
                    <label>Pad <input type="range" id="paddingSlider" min="20" max="100" value="50"></label>
                    <label>Boost <input type="range" id="boostSlider" min="120" max="220" value="160"></label>
                </div>
            </div>
        </div>

        <div class="side-panel">
            <div class="panel">
                <h3><i class="fas fa-images"></i> Picha</h3>
                <div class="btn-row">
                    <button id="addImageBtn" class="primary">Ongeza</button>
                    <button id="clearImagesBtn" class="danger">Futa Zote</button>
                </div>
                <div class="image-list" id="imageList"></div>
                <label style="margin-top:6px">Effect ya Picha</label>
                <select id="imageEffect">
                    <option value="none">None</option>
                    <option value="fade">Fade</option>
                    <option value="zoom">Zoom In</option>
                    <option value="kenburns">Ken Burns</option>
                    <option value="slide">Slide</option>
                    <option value="pulse">Pulse</option>
                    <option value="vibrant">Vibrant</option>
                </select>
            </div>

            <div class="panel">
                <h3><i class="fas fa-font"></i> Text</h3>
                <textarea id="textInput" placeholder="Andika text..."></textarea>
                <div style="display:flex;gap:5px">
                    <select id="textFont" style="flex:1">
                        <option value="Arial Black">Arial Black</option>
                        <option value="Impact">Impact</option>
                        <option value="Georgia">Georgia</option>
                    </select>
                    <input type="number" id="textSize" value="52" min="18" max="140" style="width:55px">
                </div>
                <input type="color" id="textColor" value="#ffffff" style="width:100%;height:28px;margin-bottom:5px">
                <label><input type="checkbox" id="textBold" checked> Bold</label>
                <div class="btn-row">
                    <button id="addTextBtn" class="primary">Ongeza Text</button>
                    <button id="clearTextBtn" class="danger">Futa</button>
                </div>
            </div>

            <div class="panel">
                <h3><i class="fas fa-download"></i> Pakua</h3>
                <div class="btn-row">
                    <button id="exportVideoBtn" class="success"><i class="fas fa-video"></i> Video</button>
                    <button id="exportWavBtn"><i class="fas fa-file-audio"></i> WAV</button>
                </div>
            </div>
        </div>
    </div>

    <div class="info-bar">
        Buruta <b>kimshale cha manjano</b> kwenye waveform → achilia → itacheza kutoka pale. Undo / Redo zinapatikana.
    </div>
</div>

<script>
(function(){
    // ========== CORE VARIABLES ==========
    const waveCanvas = document.getElementById('waveCanvas');
    const wctx = waveCanvas.getContext('2d');
    const previewCanvas = document.getElementById('previewCanvas');
    const pctx = previewCanvas.getContext('2d');
    const container = document.getElementById('wave-container');
    const playheadEl = document.getElementById('playhead');

    let audioCtx = null;
    let originalBuffer = null;
    let audioBuffer = null;
    let source = null;
    let isPlaying = false;
    let startTime = 0;
    let pauseOffset = 0;
    let currentTime = 0;
    let animId = null;

    let images = [];
    let textOverlays = [];
    let selectedTextIdx = -1;

    // History for Undo/Redo
    let history = [];
    let historyIndex = -1;

    // Playhead drag
    let isDraggingPlayhead = false;

    function initAudio(){
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
    }

    function formatTime(t){
        const m = Math.floor(t / 60);
        const s = Math.floor(t % 60);
        const ms = Math.floor((t % 1) * 10);
        return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${ms}`;
    }

    // ========== HISTORY (Undo / Redo) ==========
    function saveState(){
        // Keep only audio buffer history for reliability
        if(!audioBuffer) return;
        const copy = audioCtx.createBuffer(1, audioBuffer.length, audioBuffer.sampleRate);
        copy.copyToChannel(audioBuffer.getChannelData(0).slice(0), 0);
        
        // Remove future states if we are not at the end
        history = history.slice(0, historyIndex + 1);
        history.push(copy);
        historyIndex = history.length - 1;
        
        // Limit history size
        if(history.length > 20){
            history.shift();
            historyIndex--;
        }
        updateUndoRedoButtons();
    }

    function undo(){
        if(historyIndex <= 0) return;
        historyIndex--;
        loadAudio(history[historyIndex], false);
        document.getElementById('statusDisplay').textContent = 'Undo';
        updateUndoRedoButtons();
    }

    function redo(){
        if(historyIndex >= history.length - 1) return;
        historyIndex++;
        loadAudio(history[historyIndex], false);
        document.getElementById('statusDisplay').textContent = 'Redo';
        updateUndoRedoButtons();
    }

    function updateUndoRedoButtons(){
        document.getElementById('undoBtn').disabled = historyIndex <= 0;
        document.getElementById('redoBtn').disabled = historyIndex >= history.length - 1;
    }

    // ========== AUDIO LOAD & WAVEFORM ==========
    function loadAudio(buffer, storeOriginal = true){
        if(storeOriginal) originalBuffer = buffer;
        audioBuffer = buffer;
        renderWaveform(buffer);
        updateTimeDisplay();
        pauseOffset = 0;
        currentTime = 0;
        playheadEl.style.left = '0%';
        if(isPlaying) stopPlayback();
        document.getElementById('statusDisplay').textContent = 'Imepakiwa';
    }

    function renderWaveform(buffer){
        if(!buffer) return;
        const data = buffer.getChannelData(0);
        const width = waveCanvas.width;
        const height = waveCanvas.height;
        const step = Math.max(1, Math.floor(data.length / width));

        wctx.fillStyle = '#020617';
        wctx.fillRect(0, 0, width, height);
        wctx.beginPath();
        wctx.strokeStyle = '#60a5fa';
        wctx.lineWidth = 1.5;

        for(let i = 0; i < width; i++){
            let min = 1, max = -1;
            for(let j = 0; j < step; j++){
                const idx = i * step + j;
                if(idx < data.length){
                    const v = data[idx];
                    if(v < min) min = v;
                    if(v > max) max = v;
                }
            }
            const y1 = height/2 - max * height * 0.42;
            const y2 = height/2 - min * height * 0.42;
            wctx.moveTo(i, y1);
            wctx.lineTo(i, y2);
        }
        wctx.stroke();
    }

    // ========== PLAYBACK ==========
    function playAudio(fromTime = null){
        if(!audioBuffer) return;
        initAudio();
        if(audioCtx.state === 'suspended') audioCtx.resume();

        if(isPlaying){
            source.stop();
            isPlaying = false;
        }

        if(fromTime !== null){
            pauseOffset = Math.max(0, Math.min(fromTime, audioBuffer.duration));
        }

        source = audioCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(audioCtx.destination);
        source.start(0, pauseOffset);
        startTime = audioCtx.currentTime - pauseOffset;
        isPlaying = true;
        document.getElementById('playBtn').innerHTML = '<i class="fas fa-pause"></i>';
        updatePlayhead();
    }

    function pausePlayback(){
        if(!isPlaying) return;
        source.stop();
        isPlaying = false;
        pauseOffset = audioCtx.currentTime - startTime;
        cancelAnimationFrame(animId);
        document.getElementById('playBtn').innerHTML = '<i class="fas fa-play"></i>';
    }

    function stopPlayback(){
        if(source) try{ source.stop(); }catch(e){}
        isPlaying = false;
        pauseOffset = 0;
        currentTime = 0;
        cancelAnimationFrame(animId);
        playheadEl.style.left = '0%';
        updateTimeDisplay();
        document.getElementById('playBtn').innerHTML = '<i class="fas fa-play"></i>';
    }

    function updatePlayhead(){
        if(!isPlaying || !audioBuffer) return;
        currentTime = Math.min(audioCtx.currentTime - startTime, audioBuffer.duration);
        const pct = (currentTime / audioBuffer.duration) * 100;
        playheadEl.style.left = pct + '%';
        updateTimeDisplay();

        if(currentTime >= audioBuffer.duration - 0.05){
            stopPlayback();
            return;
        }
        animId = requestAnimationFrame(updatePlayhead);
    }

    function updateTimeDisplay(){
        const dur = audioBuffer ? audioBuffer.duration : 0;
        document.getElementById('timeDisplay').textContent = 
            `${formatTime(Math.min(currentTime, dur))} / ${formatTime(dur)}`;
    }

    // ========== PLAYHEAD DRAG (Muhimu sana) ==========
    function getTimeFromX(clientX){
        const rect = container.getBoundingClientRect();
        let pct = (clientX - rect.left) / rect.width;
        pct = Math.max(0, Math.min(1, pct));
        return pct * (audioBuffer ? audioBuffer.duration : 0);
    }

    playheadEl.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        isDraggingPlayhead = true;
        if(isPlaying) pausePlayback();
    });

    container.addEventListener('mousedown', (e) => {
        if(!audioBuffer) return;
        // Click anywhere on waveform to move playhead
        const time = getTimeFromX(e.clientX);
        currentTime = time;
        pauseOffset = time;
        playheadEl.style.left = (time / audioBuffer.duration * 100) + '%';
        updateTimeDisplay();
    });

    window.addEventListener('mousemove', (e) => {
        if(!isDraggingPlayhead || !audioBuffer) return;
        const time = getTimeFromX(e.clientX);
        currentTime = time;
        pauseOffset = time;
        playheadEl.style.left = (time / audioBuffer.duration * 100) + '%';
        updateTimeDisplay();
    });

    window.addEventListener('mouseup', () => {
        if(isDraggingPlayhead){
            isDraggingPlayhead = false;
            // Optional: auto play from new position
            // playAudio(pauseOffset);
        }
    });

    // ========== SILENCE REMOVAL ==========
    function aiRemoveSilence(buffer){
        if(!buffer) return buffer;
        const data = buffer.getChannelData(0);
        const rate = buffer.sampleRate;
        const threshold = Math.pow(10, -45/20);
        const minSilence = Math.floor(0.5 * rate);
        const padding = Math.floor(0.05 * rate);
        const fade = Math.floor(0.012 * rate);
        const win = Math.floor(rate * 0.02);

        let segments = [];
        let inSound = false, soundStart = 0, silenceStart = 0;

        for(let i=0; i<data.length; i+=Math.floor(win/2)){
            let sum = 0;
            const end = Math.min(i+win, data.length);
            for(let j=i;j<end;j++) sum += data[j]*data[j];
            const energy = Math.sqrt(sum / (end-i));

            if(energy > threshold){
                if(!inSound){
                    inSound = true;
                    soundStart = Math.max(0, i - padding);
                }
            } else {
                if(inSound){
                    if(i - silenceStart > minSilence){
                        segments.push({start: soundStart, end: Math.min(data.length, silenceStart + padding)});
                        inSound = false;
                    }
                    silenceStart = i;
                }
            }
        }
        if(inSound) segments.push({start: soundStart, end: data.length});

        if(segments.length === 0) return buffer;

        let newData = [];
        segments.forEach((seg, idx) => {
            let part = Array.from(data.slice(seg.start, seg.end));
            // fade
            for(let i=0;i<Math.min(fade, part.length);i++){
                part[i] *= i/fade;
                part[part.length-1-i] *= i/fade;
            }
            if(idx > 0){
                const cf = Math.min(fade, part.length, newData.length);
                for(let i=0;i<cf;i++){
                    const t = i/cf;
                    newData[newData.length-cf+i] = newData[newData.length-cf+i]*(1-t) + part[i]*t;
                }
                newData.push(...part.slice(cf));
            } else {
                newData.push(...part);
            }
        });

        const nb = audioCtx.createBuffer(1, newData.length, rate);
        nb.copyToChannel(new Float32Array(newData), 0);
        return nb;
    }

    // ========== EVENTS ==========
    document.getElementById('playBtn').onclick = () => {
        if(isPlaying) pausePlayback();
        else playAudio();
    };
    document.getElementById('pauseBtn').onclick = pausePlayback;
    document.getElementById('stopPlayBtn').onclick = stopPlayback;

    document.getElementById('undoBtn').onclick = undo;
    document.getElementById('redoBtn').onclick = redo;

    document.getElementById('uploadAudioBtn').onclick = () => document.getElementById('audioInput').click();
    document.getElementById('audioInput').onchange = async (e) => {
        const f = e.target.files[0];
        if(!f) return;
        initAudio();
        const buf = await audioCtx.decodeAudioData(await f.arrayBuffer());
        loadAudio(buf);
        saveState();
    };

    document.getElementById('autoRemoveBtn').onclick = () => {
        if(!originalBuffer) return alert('Weka audio kwanza');
        saveState();
        const result = aiRemoveSilence(originalBuffer);
        loadAudio(result, false);
        document.getElementById('statusDisplay').textContent = 'Silence imeondolewa';
    };

    document.getElementById('enhanceBtn').onclick = () => {
        if(!audioBuffer) return;
        saveState();
        // simple boost
        const data = audioBuffer.getChannelData(0);
        const out = new Float32Array(data.length);
        const boost = 1.6;
        for(let i=0;i<data.length;i++){
            let s = data[i] * boost;
            out[i] = Math.max(-0.95, Math.min(0.95, s));
        }
        const nb = audioCtx.createBuffer(1, data.length, audioBuffer.sampleRate);
        nb.copyToChannel(out, 0);
        loadAudio(nb, false);
        document.getElementById('statusDisplay').textContent = 'Boost imetumika';
    };

    // Images
    document.getElementById('addImageBtn').onclick = () => document.getElementById('imageInput').click();
    document.getElementById('imageInput').onchange = (e) => {
        Array.from(e.target.files).forEach(file => {
            const img = new Image();
            img.onload = () => {
                images.push({img, name: file.name});
                renderImageList();
                drawPreviewFrame(0);
            };
            img.src = URL.createObjectURL(file);
        });
    };

    function renderImageList(){
        const list = document.getElementById('imageList');
        list.innerHTML = '';
        images.forEach((item, i) => {
            const wrap = document.createElement('div');
            wrap.className = 'thumb-wrap';
            const thumb = document.createElement('img');
            thumb.src = item.img.src;
            thumb.className = 'image-thumb';
            const del = document.createElement('div');
            del.className = 'thumb-del';
            del.innerHTML = '×';
            del.onclick = (e) => {
                e.stopPropagation();
                images.splice(i, 1);
                renderImageList();
                drawPreviewFrame(0);
            };
            wrap.appendChild(thumb);
            wrap.appendChild(del);
            list.appendChild(wrap);
        });
    }

    // Text
    document.getElementById('addTextBtn').onclick = () => {
        const text = document.getElementById('textInput').value.trim();
        if(!text) return;
        textOverlays.push({
            text,
            font: document.getElementById('textFont').value,
            size: parseInt(document.getElementById('textSize').value) || 52,
            color: document.getElementById('textColor').value,
            bold: document.getElementById('textBold').checked,
            x: previewCanvas.width / 2,
            y: previewCanvas.height * 0.75,
            scale: 1,
            rotation: 0
        });
        drawPreviewFrame(0);
    };

    // Preview draw (simplified)
    function drawPreviewFrame(time){
        const w = previewCanvas.width;
        const h = previewCanvas.height;
        pctx.fillStyle = '#000';
        pctx.fillRect(0, 0, w, h);

        if(images.length > 0){
            const duration = audioBuffer ? audioBuffer.duration : 6;
            const idx = Math.min(images.length-1, Math.floor((time / duration) * images.length));
            const imgObj = images[idx].img;
            if(imgObj && imgObj.complete){
                const scale = Math.max(w / imgObj.width, h / imgObj.height);
                const iw = imgObj.width * scale;
                const ih = imgObj.height * scale;
                pctx.drawImage(imgObj, (w-iw)/2, (h-ih)/2, iw, ih);
            }
        }

        textOverlays.forEach(t => {
            pctx.save();
            pctx.translate(t.x, t.y);
            pctx.scale(t.scale, t.scale);
            pctx.font = `${t.bold ? 'bold' : 'normal'} ${t.size}px ${t.font}`;
            pctx.fillStyle = t.color;
            pctx.textAlign = 'center';
            pctx.textBaseline = 'middle';
            pctx.fillText(t.text, 0, 0);
            pctx.restore();
        });
    }

    function updateCanvasSize(){
        const res = parseInt(document.getElementById('resSelect').value);
        const aspect = document.getElementById('aspectSelect').value;
        let w, h;
        if(aspect === '16:9'){ w = res === 1080 ? 1920 : res === 720 ? 1280 : 854; h = res; }
        else if(aspect === '9:16'){ h = res === 1080 ? 1920 : res === 720 ? 1280 : 854; w = res; }
        else { w = h = res; }
        previewCanvas.width = w;
        previewCanvas.height = h;
        document.getElementById('previewRes').textContent = `${w}×${h}`;
        drawPreviewFrame(currentTime || 0);
    }

    document.getElementById('aspectSelect').onchange = updateCanvasSize;
    document.getElementById('resSelect').onchange = updateCanvasSize;

    // Simple export (WAV works reliably)
    document.getElementById('exportWavBtn').onclick = () => {
        if(!audioBuffer) return alert('Hakuna audio');
        const data = audioBuffer.getChannelData(0);
        const buf = new ArrayBuffer(44 + data.length * 2);
        const v = new DataView(buf);
        const writeStr = (o, s) => { for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
        writeStr(0, 'RIFF'); v.setUint32(4, 36 + data.length*2, true);
        writeStr(8, 'WAVE'); writeStr(12, 'fmt ');
        v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
        v.setUint32(24, audioBuffer.sampleRate, true);
        v.setUint32(28, audioBuffer.sampleRate * 2, true);
        v.setUint16(32, 2, true); v.setUint16(34, 16, true);
        writeStr(36, 'data'); v.setUint32(40, data.length*2, true);
        for(let i=0;i<data.length;i++) v.setInt16(44 + i*2, Math.max(-1, Math.min(1, data[i])) * 0x7FFF, true);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([buf], {type: 'audio/wav'}));
        a.download = `voice_${Date.now()}.wav`;
        a.click();
    };

    // Resize wave
    function resizeWave(){
        const rect = container.getBoundingClientRect();
        waveCanvas.width = rect.width;
        waveCanvas.height = rect.height;
        if(audioBuffer) renderWaveform(audioBuffer);
    }
    window.addEventListener('resize', resizeWave);
    setTimeout(resizeWave, 80);
    updateCanvasSize();
    updateUndoRedoButtons();
})();
</script>
</body>
</html>
